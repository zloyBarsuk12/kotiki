<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Котик</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
  body { width: 220px; height: 180px; font-family: "Segoe UI", system-ui, sans-serif; }
  #stage { position: relative; width: 220px; height: 180px; }
  #c { position: absolute; left: 0; top: 0; width: 220px; height: 180px; }
  #c.grab { cursor: grabbing; }
  #bubble.whisper { font-style: italic; opacity: .85; font-size: 90%; }
  #bubble { position: absolute; left: 110px; top: 6px; transform: translateX(-50%) scale(.6); opacity: 0;
    background: #fff; color: #222; border: 1.5px solid #333; border-radius: 12px; padding: 4px 10px;
    font-size: 13px; font-weight: 600; white-space: nowrap; transition: opacity .15s, transform .15s; pointer-events: none;
    box-shadow: 0 2px 6px rgba(0,0,0,.18); }
  #bubble.on { opacity: 1; transform: translateX(-50%) scale(1); }
  #bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 10px; height: 10px; margin-left: -5px;
    background: #fff; border-right: 1.5px solid #333; border-bottom: 1.5px solid #333; transform: rotate(45deg); }
  #bubble.long { font-size: 11px; white-space: normal; text-align: center; width: 160px; }
  #note { position: absolute; left: 110px; top: 4px; transform: translateX(-50%); width: 200px; box-sizing: border-box; background: #fff8e1; color: #3a2a1a; border: 1.5px solid #d9a24a; border-radius: 10px; padding: 6px 22px 7px 10px; font: 600 11.5px/1.3 "Segoe UI", system-ui, sans-serif; box-shadow: 0 3px 8px rgba(0,0,0,.28); display: none; z-index: 3; white-space: normal; word-break: break-word; }
  #note.on { display: block; animation: noteIn .35s ease-out; }
  #note small { display: block; color: #8a6a3a; font-size: 10px; margin-bottom: 2px; }
  #note b.x { position: absolute; right: 7px; top: 4px; color: #b08a5a; cursor: pointer; }
  @keyframes noteIn { from { transform: translateX(-50%) scale(.7); opacity: 0; } }
  .fx { position: absolute; pointer-events: none; font-weight: 700; }
  .heart { color: #ff5c7a; font-size: 15px; animation: floatUp 1.3s ease-out forwards; text-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .zzz { color: #6a7fd6; font-size: 13px; font-style: italic; animation: floatZ 2.4s ease-out forwards; }
  .mark { color: #e74c3c; font-size: 20px; animation: pop .8s ease-out forwards; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
  @keyframes floatUp { from { transform: translateY(0) scale(.6); opacity: 1; } to { transform: translateY(-38px) scale(1.15); opacity: 0; } }
  @keyframes floatZ { from { transform: translate(0,0) scale(.7); opacity: 0; } 20% { opacity: 1; } to { transform: translate(14px,-38px) scale(1.3); opacity: 0; } }
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 30% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="220" height="180"></canvas>
  <div id="bubble"></div>
  <div id="note"></div>
</div>
<script src="edition.js"></script><script src="gifts.js"></script><script src="palettes.js"></script>
<script src="chibi.js"></script>
<script src="looks.js"></script>
<script src="pet.js"></script>
</body>
</html>
